name: Build Flatpak Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Build Flatpak repository
        run: |
          mkdir -p public
          BUNDLE=$(ls ayugram-desktop-*.flatpak | head -n1)
          echo "Using bundle: $BUNDLE"
          mkdir -p repo
          ostree init --repo=repo --mode=archive-z2
          flatpak build-import-bundle repo "$BUNDLE"
          flatpak build-update-repo --gpg-sign=${{ secrets.GPG_FINGERPRINT }} repo
          mv repo public/repo
          cp ayugram.flatpakrepo public/
          cat > public/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><title>AyuGram Flatpak Repo</title></head>
          <body><h1>AyuGram Flatpak Repozitoriyasi</h1>
          <p>Repo: <code>https://uzAlhaitham.github.io/AyuGram-Flatpak/ayugram.flatpakrepo</code></p>
          </body></html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
