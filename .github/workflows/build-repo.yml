name: Build Flatpak Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          cat > ~/.gnupg/gpg.conf << 'CONF'
          use-agent
          pinentry-mode loopback
          no-tty
          batch
          CONF
          cat > ~/.gnupg/gpg-agent.conf << 'CONF'
          allow-loopback-pinentry
          CONF
          chmod 600 ~/.gnupg/gpg.conf ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Build Flatpak repository
        env:
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 1. 'public' papkasini yaratish (bu saytning ildizi bo'ladi)
          mkdir -p public

          # 2. Flatpak repozitoriyasini yaratish
          BUNDLE=$(ls ayugram-desktop-*.flatpak | head -n1)
          echo "Using bundle: $BUNDLE"
          mkdir -p repo
          ostree init --repo=repo --mode=archive-z2
          flatpak build-import-bundle repo "$BUNDLE"

          # 3. Repo metama'lumotlarini yaratish (imzosiz)
          flatpak build-update-repo repo

          # 4. Summary faylini GPG bilan imzolash
          gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor \
              --local-user "$GPG_FINGERPRINT" \
              -o repo/summary.sig \
              repo/summary

          # 5. 'repo' papkasini 'public' ichiga ko'chirish
          mv repo public/repo

          # 6. .flatpakrepo faylini 'public' ildiziga nusxalash
          cp ayugram.flatpakrepo public/

          # 7. 'public' ildizida 'index.html' yaratish
          cat > public/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><title>AyuGram Flatpak Repo</title></head>
          <body><h1>AyuGram Flatpak Repozitoriyasi</h1>
          <p>Repo: <code>https://uzAlhaitham.github.io/AyuGram-Flatpak/ayugram.flatpakrepo</code></p>
          </body></html>
          HTML

          # 8. Tekshirish uchun 'public' papkasi ichini ko'rsatish
          echo "=== public papkasi tarkibi ==="
          ls -la public
          echo "=== public/repo papkasi tarkibi ==="
          ls -la public/repo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          include-hidden-files: true   # Yashirin fayllarni ham qo'shish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
