name: Build Flatpak Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg

      - name: Import GPG key and preset passphrase
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          cat > ~/.gnupg/gpg.conf << 'CONF'
          use-agent
          pinentry-mode loopback
          no-tty
          CONF
          cat > ~/.gnupg/gpg-agent.conf << 'CONF'
          allow-loopback-pinentry
          allow-preset-passphrase
          default-cache-ttl 34560000
          max-cache-ttl 34560000
          CONF
          chmod 600 ~/.gnupg/gpg.conf ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          sleep 1
          gpg-connect-agent /bye || true
          sleep 1
          echo "$GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long
          KEYGRIPS=$(gpg --with-keygrip --list-secret-keys "$GPG_FINGERPRINT" | grep "Keygrip" | awk '{print $3}')
          PRESET=$(find /usr/lib -name gpg-preset-passphrase 2>/dev/null | head -n1)
          for KG in $KEYGRIPS; do
            echo "$GPG_PASSPHRASE" | "$PRESET" --preset "$KG" || true
          done

      - name: Build Flatpak repository (stable branch)
        env:
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          mkdir -p public
          BUNDLE=$(ls ayugram-desktop-*.flatpak | head -n1)
          echo "Using bundle: $BUNDLE"
          
          # ===== 1. Unique temp paths =====
          TMPREPO=$(mktemp -d)/repo
          APP_EXTRACT=$(mktemp -d)/app
          FINAL_REPO=$(mktemp -d)/repo
          
          echo "TMPREPO=$TMPREPO"
          echo "APP_EXTRACT=$APP_EXTRACT"
          echo "FINAL_REPO=$FINAL_REPO"
          
          # ===== 2. Import bundle — flatpak o'zi repo yaratadi =====
          flatpak build-import-bundle "$TMPREPO" "$BUNDLE"
          
          # ===== 3. App fayllarini chiqarish =====
          mkdir -p "$APP_EXTRACT"
          ostree --repo="$TMPREPO" checkout app/com.ayugram.desktop/x86_64/master "$APP_EXTRACT"
          
          # ===== 4. Metainfo faylini tuzatish =====
          echo "=== Metainfo files ==="
          find "$APP_EXTRACT" -name "*.metainfo.xml" -o -name "*.appdata.xml" 2>/dev/null
          
          find "$APP_EXTRACT" \( -name "*.metainfo.xml" -o -name "*.appdata.xml" \) -print0 | while IFS= read -r -d '' file; do
            echo "--- Patching: $file ---"
            sed -i 's/type="development"/type="stable"/g' "$file"
            sed -i 's/type="snapshot"/type="stable"/g' "$file"
            grep -E 'type=' "$file" | head -5 || true
          done
          
          # ===== 5. Yangi repo, stable branch =====
          mkdir -p "$FINAL_REPO"
          ostree init --repo="$FINAL_REPO" --mode=archive-z2
          
          flatpak build-export \
              --gpg-sign="$GPG_FINGERPRINT" \
              --gpg-homedir="$HOME/.gnupg" \
              "$FINAL_REPO" "$APP_EXTRACT" com.ayugram.desktop stable
          
          # ===== 6. Summary imzolash =====
          flatpak build-update-repo \
              --gpg-sign="$GPG_FINGERPRINT" \
              --gpg-homedir="$HOME/.gnupg" \
              "$FINAL_REPO"
          
          echo "=== Branch check ==="
          ostree --repo="$FINAL_REPO" refs | grep ayugram || true
          
          echo "=== Summary files ==="
          ls -la "$FINAL_REPO"/summary* || true
          
          # ===== 7. Public ga ko'chirish =====
          cp -r "$FINAL_REPO" public/repo
          cp ayugram.flatpakrepo public/
          cat > public/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><title>AyuGram Flatpak Repo</title></head>
          <body><h1>AyuGram Flatpak Repozitoriyasi</h1>
          <p>Repo: <code>https://uzAlhaitham.github.io/AyuGram-Flatpak/ayugram.flatpakrepo</code></p>
          </body></html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
