name: Build Flatpak Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find flatpak bundle
        id: find-bundle
        run: echo "file=$(ls ayugram-desktop-*.flatpak | head -n1)" >> $GITHUB_OUTPUT

      - name: Build Flatpak repository
        uses: andyholmes/flatter@main
        with:
          files: ${{ steps.find-bundle.outputs.file }}
          upload-pages-artifact: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
