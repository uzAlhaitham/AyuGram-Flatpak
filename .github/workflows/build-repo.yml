name: Build Flatpak Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      - name: Build Flatpak repository
        run: |
          mkdir -p public
          BUNDLE=$(ls ayugram-desktop-*.flatpak | head -n1)
          echo "Using bundle: $BUNDLE"
          
          # Bo'sh repozitoriya yaratish
          mkdir -p repo
          ostree init --repo=repo --mode=archive-z2
          
          # .flatpak faylni repoga import qilish
          flatpak build-import-bundle repo "$BUNDLE"
          
          # Repo metama'lumotlarini yangilash
          flatpak build-update-repo repo
          
          # Natijani public papkaga ko'chirish
          mv repo public/repo
          cp ayugram.flatpakrepo public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
